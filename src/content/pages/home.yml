seo:
  title: 'Biuro rachunkowe w Dębicy'
  fullTitle: 'Biuro rachunkowe Dębica | Doradca podatkowy Iwona Mazur'
  description: 'Biuro rachunkowe w Dębicy: księgowość, kadry i płace, rozliczenia z ZUS i US oraz doradztwo podatkowe. Umów bezpłatną 30-minutową konsultację.'
intro: 'Prowadzimy pełną księgowość i księgi przychodów i rozchodów, rozliczamy firmy z urzędem skarbowym i ZUS, zajmujemy się też kadrami i płacami. Pomagamy też przy bieżących decyzjach finansowych, więc na prowadzenie firmy zostaje Ci więcej czasu.'
