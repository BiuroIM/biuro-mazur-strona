servicesIntro: 'Obsługujemy jednoosobowe działalności, spółki handlowe i zakłady produkcyjne. Pilnujemy terminów rozliczeń i odpowiadamy na pytania, zanim zamienią się w problem.'
services:
  - name: 'Księgowość'
    description: 'Prowadzimy KPiR i księgi handlowe, wystawiamy i księgujemy faktury, a o terminach deklaracji pamiętamy za Ciebie, co miesiąc.'
  - name: 'Kadry i płace'
    description: 'Przygotowujemy umowy i listy płac, rozliczamy składki ZUS i na bieżąco prowadzimy akta pracowników, także gdy zatrudniasz kolejne osoby.'
  - name: 'Rozliczenia z ZUS i US'
    description: 'Składamy deklaracje w terminie i odpowiadamy na pisma z urzędów. Sprawy, które da się załatwić bez Twojego udziału, bierzemy na siebie.'
  - name: 'Doradztwo podatkowe'
    description: 'Pomagamy wybrać formę opodatkowania i doradzamy przy bieżących decyzjach, żeby zmiana przepisów w trakcie roku nie była dla Ciebie zaskoczeniem.'
  - name: 'Zakładanie i przekształcenia firm'
    description: 'Rejestrujemy działalność i przeprowadzamy zmianę formy prawnej. Wypełniamy wnioski i zgłaszamy firmę do ZUS oraz urzędu skarbowego.'
steps:
  - title:
      - 'Odzywasz się'
      - 'do nas'
    text: 'Piszesz albo dzwonisz. Zadajemy kilka podstawowych pytań o Twoją firmę i umawiamy termin spotkania online.'
  - title:
      - 'Trzydzieści minut'
      - 'o Twojej firmie'
    text: 'Rozmawiamy o formie działalności, obrotach, zatrudnieniu i o tym, co dziś sprawia najwięcej kłopotu. Rozmowa do niczego nie zobowiązuje.'
  - title:
      - 'Dobieramy zakres'
      - 'i wariant dla Ciebie'
    text: 'Przedstawiamy warianty współpracy z ceną i zakresem każdego z nich. Wybierasz ten, który przy Twojej skali wychodzi najkorzystniej.'
  - title:
      - 'Prowadzimy księgi'
      - 'miesiąc po miesiącu'
    text: 'Terminy, deklaracje i kontakt z urzędami bierzemy na siebie. O sprawach, które wymagają Twojej decyzji, mówimy z wyprzedzeniem.'
closing: 'Wypełnij krótki formularz, a postaramy się odpowiedzieć jak najszybciej. Pierwsza rozmowa jest bezpłatna i do niczego nie zobowiązuje.'
faq:
  - question: 'Ile kosztuje księgowość w Waszym biurze?'
    answer: 'Cena zależy od formy działalności, liczby dokumentów w miesiącu i tego, czy prowadzimy też kadry. Po krótkiej rozmowie podajemy stałą miesięczną stawkę.'
  - question: 'Czy muszę dostarczać dokumenty osobiście?'
    answer: 'Nie. Większość klientów przesyła skany albo zdjęcia dokumentów online. Papierowe faktury możesz przynosić raz w miesiącu, jeśli tak Ci wygodniej.'
  - question: 'Jak przenieść księgowość z innego biura rachunkowego?'
    answer: 'Przejmujemy dokumentację, sprawdzamy stan rozliczeń i zgłaszamy w urzędach zmianę pełnomocnictwa. Biuro możesz zmienić w dowolnym momencie roku.'
  - question: 'Czy pomagacie założyć działalność gospodarczą?'
    answer: 'Tak. Pomagamy przy rejestracji, wyborze formy opodatkowania i zgłoszeniu do ZUS. Doradzamy też, co warto zrobić na starcie, a co może poczekać.'
