seo:
  title: 'Usługi księgowe i kadrowe'
  description: 'Usługi biura rachunkowego w Dębicy: pełna księgowość, KPiR i ryczałt, VAT i JPK, kadry i płace, rozliczenia ZUS, doradztwo podatkowe i zakładanie firm.'
intro: 'Prowadzimy za Ciebie księgowość, a Ty możesz zająć się swoją firmą. Kadry, podatki i sprawy w urzędach też załatwisz w jednym biurze.'
groups:
  - title:
      - 'Księgowość'
    lead: 'Od księgi przychodów i rozchodów po bilans spółki.'
    photo: '/src/assets/photos/accountant-with-binder-at-desk.jpg'
    photoAlt: 'Księgowa z segregatorem przy biurku'
    services:
      - name: 'Pełna księgowość'
        lead: 'Księgi rachunkowe spółek'
        description: 'Obsługujemy spółki, które muszą prowadzić księgi rachunkowe. Plan kont układamy pod Twoją firmę, prowadzimy ewidencję środków trwałych i rozrachunki z kontrahentami, a raporty zarządcze przygotowujemy wtedy, gdy ich potrzebujesz.'
      - name: 'Księga przychodów i rozchodów'
        lead: 'Dla JDG i spółek cywilnych'
        description: 'Prowadzimy KPiR jednoosobowych działalności i spółek cywilnych. Dokumenty księgujemy na bieżąco, sprawdzamy limity i to, co można zaliczyć do kosztów, a co miesiąc wyliczamy zaliczkę na podatek, więc znasz kwotę przed terminem.'
      - name: 'Ewidencja ryczałtowa'
        lead: 'Dla firm na ryczałcie'
        description: 'Prowadzimy ewidencję przychodów dla firm rozliczających się ryczałtem. Pilnujemy, żeby każdy przychód miał właściwą stawkę, co miesiąc liczymy podatek, a składkę zdrowotną według progu przychodu. Przed końcem roku sprawdzamy, czy ryczałt nadal się opłaca.'
      - name: 'Ewidencja VAT'
        lead: 'Rejestry sprzedaży i zakupu'
        description: 'Prowadzimy rejestry sprzedaży i zakupu, sprawdzamy kontrahentów na białej liście i pilnujemy, w którym miesiącu przysługuje odliczenie podatku. Faktury korygujące ujmujemy w okresie, w którym wymagają tego przepisy.'
      - name: 'Pliki JPK'
        lead: 'JPK_V7 i pliki z ksiąg'
        description: 'Wysyłamy JPK_V7 w Twoim imieniu i pilnujemy oznaczeń transakcji oraz terminów, żeby urząd nie miał powodów do pytań. Przygotowujemy też pliki JPK z ksiąg, które od rozliczenia za 2026 rok trafiają do urzędu skarbowego.'
      - name: 'Sprawozdania finansowe'
        lead: 'Bilans i rachunek zysków i strat'
        description: 'Przygotowujemy bilans, rachunek zysków i strat oraz informację dodatkową w formacie wymaganym przez KRS. Przypominamy o terminie zatwierdzenia i pilnujemy elektronicznych podpisów członków zarządu.'
  - title:
      - 'Kadry, płace'
      - 'i ZUS'
    lead: 'Umowy, wypłaty i składki Twoich pracowników.'
    photo: '/src/assets/photos/curly-haired-accountant-smiling-at-desk.jpg'
    photoAlt: 'Uśmiechnięta księgowa przy biurku'
    services:
      - name: 'Kadry'
        lead: 'Umowy, akta i czas pracy'
        description: 'Przygotowujemy umowy, prowadzimy akta osobowe i ewidencję czasu pracy oraz resztę dokumentów związanych z zatrudnieniem. Pilnujemy, żeby wszystkie formalności zgadzały się z aktualnym prawem pracy.'
      - name: 'Płace'
        lead: 'Wynagrodzenia, urlopy i zwolnienia'
        description: 'Sporządzamy listy płac i naliczamy wynagrodzenia. Rozliczamy urlopy, zwolnienia lekarskie i inne świadczenia, a za pracowników przygotowujemy deklaracje i rozliczenia podatkowe.'
      - name: 'ZUS'
        lead: 'Zgłoszenia, składki i deklaracje'
        description: 'Zgłaszamy do ZUS i wyrejestrowujemy pracowników oraz właściciela firmy, naliczamy składki i składamy deklaracje. Załatwiamy też pozostałe formalności ubezpieczeniowe i pilnujemy, żeby każde rozliczenie poszło na czas.'
  - title:
      - 'Podatki'
      - 'i urzędy'
    lead: 'Rozliczenia roczne i doradztwo podatkowe.'
    photo: '/src/assets/photos/floral-suit-advising-client.jpg'
    photoAlt: 'Doradczyni omawia sprawę z klientką'
    services:
      - name: 'Deklaracje i rozliczenia roczne'
        lead: 'PIT i CIT za cały rok'
        description: 'Przygotowujemy PIT i CIT oraz wszystko, co wiąże się z zamknięciem roku. Sprawdzamy, z jakich ulg i odliczeń możesz skorzystać, a gotowe zeznanie wysyłamy elektronicznie.'
      - name: 'Doradztwo podatkowe'
        lead: 'Skutki podatkowe przed decyzją'
        description: 'Zanim podpiszesz umowę albo zmienisz formę opodatkowania, sprawdzamy skutki podatkowe. Proponujemy rozwiązanie zgodne z przepisami i korzystne dla firmy, a wnioski przekazujemy na piśmie.'
  - title:
      - 'Nowa firma'
    lead: 'Pierwsze kroki od wyboru formy do rejestracji.'
    services:
      - name: 'Zakładanie działalności i spółek'
        lead: 'Rejestracja w CEIDG albo KRS'
        description: 'Pomagamy wybrać formę prawną i sposób opodatkowania, wypełniamy wnioski do CEIDG lub KRS i zgłaszamy firmę do urzędu skarbowego oraz ZUS. W pierwszych miesiącach tłumaczymy każdy krok.'
standards:
  - title:
      - 'Jedna osoba'
      - 'prowadząca'
    description: 'Twoje sprawy prowadzi jedna księgowa, która zna Twoją firmę. Kontaktujesz się z nią bezpośrednio, bez przełączania między działami.'
  - title:
      - 'Terminy'
      - 'po naszej stronie'
    description: 'Pilnujemy terminów deklaracji, plików JPK i składek ZUS. Pisma z urzędów odbieramy i odpowiadamy na nie w Twoim imieniu, więc nie musisz śledzić kalendarza podatkowego.'
  - title:
      - 'Decyzje'
      - 'z wyprzedzeniem'
    description: 'Gdy zbliża się zmiana przepisów, przekroczenie limitu albo czas na wybór formy opodatkowania, dajemy znać wcześniej. Decyzję podejmujesz na spokojnie, zanim minie termin.'
closing: 'Wypełnij formularz, a postaramy się odpowiedzieć jak najszybciej z propozycją zakresu obsługi i wyceną.'
