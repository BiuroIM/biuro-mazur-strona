seo:
  title: 'O nas'
  description: 'Biuro rachunkowe w Dębicy z ponad 20-letnim doświadczeniem. Dziesięć osób w zespole i ponad 90 firm, którym prowadzimy księgowość, kadry i podatki.'
intro: 'Od ponad dwudziestu lat prowadzimy księgowość firm z Dębicy i całej Polski. Spokojnie, terminowo i z księgowym, który zna Twoją firmę.'
paragraphs:
  - 'Biuro Rachunkowe Iwona Mazur od ponad dwudziestu lat prowadzi księgi firm z Dębicy i okolic. Na początku obsługiwaliśmy kilka lokalnych działalności i wystarczała do tego jedna księgowa przy telefonie. Dziś mamy ponad dziewięćdziesięciu klientów, od jednoosobowych działalności po spółki handlowe i zakłady produkcyjne, a w zespole pracuje dziesięć osób. Jedno się nie zmieniło: każdy klient ma swojego księgowego, który zna jego firmę i jej historię, więc pyta o sprawę, zanim zrobi się z niej problem.'
  - 'W biurze prowadzimy pełną księgowość i księgi przychodów i rozchodów, kadry i płace oraz doradztwo podatkowe. Rozliczamy VAT krajowy i transakcje zagraniczne oraz przygotowujemy sprawozdania finansowe. Pracujemy w Comarch Optima i w elektronicznym obiegu dokumentów, więc do współpracy nie trzeba przyjeżdżać do biura. Firmę z drugiego końca Polski obsługujemy tak samo jak tę z Dębicy.'
team:
  - name: 'Iwona Mazur'
    role: 'Założycielka biura'
    bio: 'Od 2002 roku prowadzi biuro i pilnuje wszystkiego, co się w nim dzieje. Jako doradca podatkowy pomaga też klientom przy umowach i zmianie formy opodatkowania.'
    photo: '/src/assets/photos/floral-suit-portrait-hand-in-pocket.jpg'
    photoAlt: 'Iwona Mazur'
    photoFocus: '41.2% 12.1%'
    photoZoom: 1.6
  - name: 'Ewelina Tomaszek'
    role: 'Kierowniczka działu księgowości'
    bio: 'Pilnuje przede wszystkim ksiąg handlowych, a na koniec roku przygotowuje sprawozdania finansowe. Rozdziela zadania w dziale i sprawdza pracę pozostałych osób.'
    photo: '/src/assets/photos/grey-blazer-portrait-arms-crossed.jpg'
    photoAlt: 'Ewelina Tomaszek'
    photoFocus: '44.7% 17.5%'
    photoZoom: 1.6
  - name: 'Klaudia Barszcz'
    role: 'Księgowa'
    bio: 'Weryfikuje i księguje dokumenty oraz rozlicza transakcje. Kontaktuje się z klientami i urzędami skarbowymi, a przy deklaracjach podatkowych pomaga reszcie zespołu.'
    photo: '/src/assets/photos/blonde-grey-blazer-portrait-arms-crossed.jpg'
    photoAlt: 'Klaudia Barszcz'
    photoFocus: '42% 12.1%'
    photoZoom: 1.6
  - name: 'Patrycja Bukowska'
    role: 'Księgowa'
    bio: 'Zajmuje się kadrami i płacami, od dokumentacji pracowniczej po wynagrodzenia i rozliczenia z ZUS. Pilnuje terminów i chętnie odpowiada na pytania klientów.'
    photo: '/src/assets/photos/beige-blazer-portrait-curly-hair.jpg'
    photoAlt: 'Patrycja Bukowska'
    photoFocus: '44.7% 12.1%'
    photoZoom: 1.6
  - name: 'Kinga Okoń'
    role: 'Księgowa'
    bio: 'W dziale księgowości obsługuje dokumenty finansowe: sprawdza faktury i wprowadza dane do systemu. Prowadzi też dokumentację i pomaga w bieżących sprawach biurowych.'
    photo: '/src/assets/photos/olive-blazer-portrait-hands-on-hips.jpg'
    photoAlt: 'Kinga Okoń'
    photoFocus: '50% 12.1%'
    photoZoom: 1.6
  - name: 'Karolina Orkisz'
    role: 'Księgowa'
    bio: 'Wprowadza dokumenty klientów do programu księgowego i prowadzi ich dokumentację. Na co dzień zajmuje się też bieżącymi sprawami biura.'
    photo: '/src/assets/photos/black-suit-portrait-hand-in-pocket.jpg'
    photoAlt: 'Karolina Orkisz'
    photoFocus: '50% 9.5%'
    photoZoom: 1.6
  - name: 'Kamila Baran'
    role: 'Księgowa'
    bio: 'Pomaga księgowym jako asystentka i przejmuje od nich część codziennych obowiązków. Opracowuje i wystawia faktury, a także utrzymuje kontakt z klientami.'
    photo: '/src/assets/photos/white-blazer-glasses-portrait.jpg'
    photoAlt: 'Kamila Baran'
    photoFocus: '50% 17.5%'
    photoZoom: 1.6
  - name: 'Monika Pieniążek'
    role: 'Księgowa'
    bio: 'Na co dzień jest w kontakcie przede wszystkim z klientami, ale też z urzędami. Prowadzi bieżące sprawy biura i ma oko na wszystko, co się w nim dzieje.'
    photo: '/src/assets/photos/black-blazer-portrait-long-hair.jpg'
    photoAlt: 'Monika Pieniążek'
    photoFocus: '44.7% 12.1%'
    photoZoom: 1.6
  - name: 'Julia Kaczor'
    role: 'Księgowa'
    bio: 'Prowadzi księgowość firm na KPiR i ryczałcie: księguje dokumenty i przygotowuje rozliczenia PIT. Gdy czegoś brakuje w dokumentach, kontaktuje się z klientem.'
    photo: '/src/assets/photos/black-blazer-white-trousers-portrait.jpg'
    photoAlt: 'Julia Kaczor'
    photoFocus: '44.7% 13.9%'
    photoZoom: 1.6
  - name: 'Paweł Garncarz'
    role: 'Informatyk'
    bio: 'Pracuje na zapleczu biura i dba o to, żeby codzienna praca szła sprawnie. Przygotowuje analizy i automatyzuje zadania, które wcześniej trzeba było robić ręcznie.'
    photo: '/src/assets/photos/black-shirt-portrait-arms-crossed.jpg'
    photoAlt: 'Paweł Garncarz'
    photoFocus: '48.1% 16%'
    photoZoom: 1.6
closing: 'Rozmowa trwa trzydzieści minut i do niczego nie zobowiązuje. Przejrzymy Twoją obecną księgowość i powiemy, co da się w niej uprościć.'
