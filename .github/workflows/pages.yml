name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Prefix root links with base path
        env:
          BASE: ${{ github.event.repository.name }}
        run: |
          find dist -name '*.html' -print0 | xargs -0 perl -pi -e 's#\b(href|src|action)="/(?!/|\Q$ENV{BASE}\E/)#$1="/$ENV{BASE}/#g'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
